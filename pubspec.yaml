name: gamblock_ai_apps
description: "Gamblock AI - Core Protection App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^15.1.2
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  crop_image: ^1.0.17
  image: ^4.9.1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# image 4.9.x needs xml ^7 for its WebP encoder, while
# flutter_local_notifications_windows pins xml ^6.5.0. The Windows plugin only
# uses XmlBuilder.element/buildDocument/toXmlString, which are unchanged in
# xml 7, so we align the whole graph on 7.0.1.
dependency_overrides:
  xml: 7.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/mini-games/
    - assets/images/mini-games/picture-forge/
    - assets/images/mini-games/twin-trace/
    - assets/protection/
    - .env
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
