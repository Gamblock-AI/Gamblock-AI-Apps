name: gamblock_ai_apps
description: "Gamblock AI - Core Protection App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^15.1.2
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.6
  lottie: ^3.3.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.2.1
  sqflite: ^2.4.2+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - .env
