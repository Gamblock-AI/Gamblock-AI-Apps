name: Research Staging Release

# Publishes the Research staging debug APK and the Windows staging pilot MSI
# (both pointing at the staging backend) as a GitHub Release for QA/test
# distribution. Diagnostic-quality artifacts, not store/pilot candidates.
# Trigger manually.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  android:
    runs-on: ubuntu-latest
    environment: pilot-signing
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore and validate Research Android signing inputs
        env:
          RESEARCH_KEYSTORE_BASE64: ${{ secrets.ANDROID_RESEARCH_KEYSTORE_BASE64 }}
          RESEARCH_STORE_PASSWORD: ${{ secrets.ANDROID_RESEARCH_KEYSTORE_PASSWORD }}
          RESEARCH_KEY_ALIAS: ${{ vars.ANDROID_RESEARCH_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${RESEARCH_KEYSTORE_BASE64:?ANDROID_RESEARCH_KEYSTORE_BASE64 is required}"
          : "${RESEARCH_STORE_PASSWORD:?ANDROID_RESEARCH_KEYSTORE_PASSWORD is required}"
          : "${RESEARCH_KEY_ALIAS:?ANDROID_RESEARCH_KEY_ALIAS is required}"
          printf '%s' "$RESEARCH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamblock-research.jks"
          keytool -list -keystore "$RUNNER_TEMP/gamblock-research.jks" \
            -storepass "$RESEARCH_STORE_PASSWORD" -alias "$RESEARCH_KEY_ALIAS" > /dev/null
      - name: Create staging configuration
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$WEB_BASE_URL"
          printf '%s\n' \
            'APP_ENV=staging' \
            "API_BASE_URL=$API_BASE_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" > .env
      - name: Validate public grant trust store
        env:
          TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${TRUST_STORE_BASE64:?PROTECTION_GRANT_TRUST_STORE_BASE64 is required}"
          printf '%s' "$TRUST_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grant-trust-store.json"
          jq -e 'type == "object" and length > 0 and all(to_entries[]; (.key | length > 0) and (.value | type == "string" and length > 0))' \
            "$RUNNER_TEMP/grant-trust-store.json" > /dev/null
          while IFS= read -r public_key; do
            printf '%s' "$public_key" | base64 --decode > "$RUNNER_TEMP/grant-public-key.der"
            openssl ec -pubin -inform DER \
              -in "$RUNNER_TEMP/grant-public-key.der" -text -noout 2> /dev/null | \
              grep -Eq 'ASN1 OID: prime256v1|NIST CURVE: P-256'
          done < <(jq -r '.[]' "$RUNNER_TEMP/grant-trust-store.json")
      - run: flutter pub get
      - name: Build signed Research staging APK
        env:
          RESEARCH_KEYSTORE_PATH: ${{ runner.temp }}/gamblock-research.jks
          RESEARCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RESEARCH_KEYSTORE_PASSWORD }}
          RESEARCH_KEY_ALIAS: ${{ vars.ANDROID_RESEARCH_KEY_ALIAS }}
          RESEARCH_KEY_PASSWORD: ${{ secrets.ANDROID_RESEARCH_KEY_PASSWORD }}
          PROTECTION_GRANT_TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: |
          flutter build apk --release --flavor research \
            --build-name "${{ github.event.inputs.version }}" \
            --build-number "$GITHUB_RUN_NUMBER"
      - name: Name and hash artifact
        run: |
          version="${{ github.event.inputs.version }}"
          mkdir -p staging-artifacts
          cp build/app/outputs/flutter-apk/app-research-release.apk \
            "staging-artifacts/gamblock-ai-research-staging-${version}+${GITHUB_RUN_NUMBER}.apk"
          sha256sum staging-artifacts/gamblock-ai-research-staging-*.apk > staging-artifacts/android-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: research-staging-android
          path: staging-artifacts
          retention-days: 7

  windows:
    runs-on: windows-latest
    environment: pilot-signing
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore and trust pilot certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_PILOT_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_PILOT_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { throw "WINDOWS_PILOT_SIGNING_PFX_BASE64 is required" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) { throw "WINDOWS_PILOT_SIGNING_PFX_PASSWORD is required" }
          $pfxPath = "$env:RUNNER_TEMP\gamblock-pilot-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $password)
          $rootStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "LocalMachine")
          $rootStore.Open("ReadWrite")
          $rootStore.Add($cert)
          $rootStore.Close()
          $publisherStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPublisher", "LocalMachine")
          $publisherStore.Open("ReadWrite")
          $publisherStore.Add($cert)
          $publisherStore.Close()
      - name: Create staging configuration
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) { throw "STAGING_API_BASE_URL is required" }
          if ([string]::IsNullOrWhiteSpace($env:WEB_BASE_URL)) { throw "STAGING_WEB_BASE_URL is required" }
          @"
          APP_ENV=staging
          API_BASE_URL=$env:API_BASE_URL
          WEB_BASE_URL=$env:WEB_BASE_URL
          "@ | Set-Content -Encoding utf8NoBOM .env
      - name: Validate public grant trust store
        shell: pwsh
        env:
          TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TRUST_STORE_BASE64)) { throw "PROTECTION_GRANT_TRUST_STORE_BASE64 is required" }
          $json = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TRUST_STORE_BASE64))
          $trustStore = $json | ConvertFrom-Json
          if ($trustStore -isnot [pscustomobject] -or @($trustStore.PSObject.Properties).Count -eq 0) {
            throw "PROTECTION_GRANT_TRUST_STORE_BASE64 must decode to a non-empty JSON object"
          }
          foreach ($property in $trustStore.PSObject.Properties) {
            if ([string]::IsNullOrWhiteSpace($property.Name) -or $property.Value -isnot [string] -or [string]::IsNullOrWhiteSpace($property.Value)) {
              throw "PROTECTION_GRANT_TRUST_STORE_BASE64 keys and values must be non-empty strings"
            }
            try {
              $decodedKey = [Convert]::FromBase64String($property.Value)
            } catch {
              throw "PROTECTION_GRANT_TRUST_STORE_BASE64 values must be base64 DER public keys"
            }
            if ($decodedKey.Length -eq 0) {
              throw "PROTECTION_GRANT_TRUST_STORE_BASE64 values must decode to non-empty public keys"
            }
            $ecdsa = [Security.Cryptography.ECDsa]::Create()
            try {
              $bytesRead = 0
              $ecdsa.ImportSubjectPublicKeyInfo($decodedKey, [ref]$bytesRead)
              if ($bytesRead -ne $decodedKey.Length -or $ecdsa.KeySize -ne 256) {
                throw "unexpected key encoding or curve"
              }
            } catch {
              throw "PROTECTION_GRANT_TRUST_STORE_BASE64 values must be DER P-256 public keys"
            } finally {
              $ecdsa.Dispose()
            }
          }
      - run: flutter pub get
      - name: Build Windows staging bundle
        env:
          PROTECTION_GRANT_TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: flutter build windows --release
      - name: Sign binaries, build staging MSI, and verify signatures
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_PILOT_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          $bundle = (Resolve-Path "build\windows\x64\runner\Release").Path
          $pfx = "$env:RUNNER_TEMP\gamblock-pilot-signing.pfx"

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe not found under Windows Kits" }
          $signtool = $signtool.FullName

          function Sign-Artifact([string] $path) {
            $arguments = @("sign", "/fd", "SHA256", "/f", $pfx, "/p", $env:SIGNING_PFX_PASSWORD)
            if (-not [string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)) {
              $arguments += @("/td", "SHA256", "/tr", $env:TIMESTAMP_URL)
            }
            $arguments += $path
            & $signtool @arguments
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $path" }
            & $signtool verify /pa /all $path
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $path" }
          }

          Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') } |
            ForEach-Object { Sign-Artifact $_.FullName }

          dotnet build windows\installer\GamblockAI.wixproj `
            -c Release -p:Platform=x64 -p:BundlePath="$bundle" `
            -p:ProductVersion="$version"
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }

          $msi = "windows\installer\bin\x64\Release\GamblockAI-$version-x64.msi"
          if (-not (Test-Path $msi)) { throw "Expected MSI was not produced: $msi" }
          Sign-Artifact $msi
          New-Item -ItemType Directory -Force -Path staging-artifacts | Out-Null
          Copy-Item $msi "staging-artifacts\GamblockAI-Pilot-Staging-$version-x64.msi"
          Get-FileHash "staging-artifacts\GamblockAI-Pilot-Staging-$version-x64.msi" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  GamblockAI-Pilot-Staging-$version-x64.msi" } |
            Set-Content -Encoding ascii staging-artifacts\windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: research-staging-windows
          path: staging-artifacts
          retention-days: 7

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Research Staging v${{ github.event.inputs.version }}"
          tag_name: "research-staging-v${{ github.event.inputs.version }}"
          body: |
            Research staging artifacts pointing at the staging backend
            (`api-staging.gamblock-ai.com`). Test data lands in the
            `gamblock_staging` database and never mixes with production.

            - APK: research flavor, signed (persistent staging/pilot key)
            - Windows MSI: self-signed Authenticode pilot certificate
            - Verified: CI build only; no real-device evidence claimed
          files: |
            staging-artifacts/**/*
