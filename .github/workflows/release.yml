name: Signed Release Candidates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (e.g. 1.2.0)'
        required: true
        type: string

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$GITHUB_REF_NAME" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$INPUT_VERSION"
          else
            echo "No immutable semantic version: set the vX.Y.Z tag or pass the version input." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Create public production configuration
        env:
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL"
          test -n "$WEB_BASE_URL"
          printf '%s\n' \
            'APP_ENV=production' \
            "API_BASE_URL=$API_BASE_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" > .env
      - run: bash scripts/verify-ai-context.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: verify
    if: ${{ vars.ENABLE_PRODUCTION_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore and validate Android signing inputs
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.ANDROID_PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ vars.ANDROID_PLAY_KEY_ALIAS }}
          RESEARCH_KEYSTORE_BASE64: ${{ secrets.ANDROID_RESEARCH_KEYSTORE_BASE64 }}
          RESEARCH_STORE_PASSWORD: ${{ secrets.ANDROID_RESEARCH_KEYSTORE_PASSWORD }}
          RESEARCH_KEY_ALIAS: ${{ vars.ANDROID_RESEARCH_KEY_ALIAS }}
          TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${PLAY_KEYSTORE_BASE64:?ANDROID_PLAY_KEYSTORE_BASE64 is required}"
          : "${PLAY_STORE_PASSWORD:?ANDROID_PLAY_KEYSTORE_PASSWORD is required}"
          : "${PLAY_KEY_ALIAS:?ANDROID_PLAY_KEY_ALIAS is required}"
          : "${RESEARCH_KEYSTORE_BASE64:?ANDROID_RESEARCH_KEYSTORE_BASE64 is required}"
          : "${RESEARCH_STORE_PASSWORD:?ANDROID_RESEARCH_KEYSTORE_PASSWORD is required}"
          : "${RESEARCH_KEY_ALIAS:?ANDROID_RESEARCH_KEY_ALIAS is required}"
          : "${TRUST_STORE_BASE64:?PROTECTION_GRANT_TRUST_STORE_BASE64 is required}"
          printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamblock-play.jks"
          printf '%s' "$RESEARCH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamblock-research.jks"
          printf '%s' "$TRUST_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grant-trust-store.json"
          jq -e 'type == "object" and length > 0 and all(.[]; type == "string" and length > 0)' \
            "$RUNNER_TEMP/grant-trust-store.json" > /dev/null
          keytool -list -keystore "$RUNNER_TEMP/gamblock-play.jks" \
            -storepass "$PLAY_STORE_PASSWORD" -alias "$PLAY_KEY_ALIAS" > /dev/null
          keytool -list -keystore "$RUNNER_TEMP/gamblock-research.jks" \
            -storepass "$RESEARCH_STORE_PASSWORD" -alias "$RESEARCH_KEY_ALIAS" > /dev/null
      - name: Create public production configuration
        env:
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL"
          test -n "$WEB_BASE_URL"
          printf '%s\n' \
            'APP_ENV=production' \
            "API_BASE_URL=$API_BASE_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" > .env
      - run: flutter pub get
      - name: Build signed Play AAB and Research APK
        env:
          GAMBLOCK_SIGNED_RELEASE: 'true'
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/gamblock-play.jks
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ vars.ANDROID_PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_KEY_PASSWORD }}
          RESEARCH_KEYSTORE_PATH: ${{ runner.temp }}/gamblock-research.jks
          RESEARCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RESEARCH_KEYSTORE_PASSWORD }}
          RESEARCH_KEY_ALIAS: ${{ vars.ANDROID_RESEARCH_KEY_ALIAS }}
          RESEARCH_KEY_PASSWORD: ${{ secrets.ANDROID_RESEARCH_KEY_PASSWORD }}
          PROTECTION_GRANT_TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: |
          set -euo pipefail
          version_name="${{ needs.verify.outputs.version }}"
          flutter build appbundle --release --flavor play \
            --build-name "$version_name" --build-number "$GITHUB_RUN_NUMBER"
          flutter build apk --release --flavor research \
            --build-name "$version_name" --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify and name Android artifacts
        run: |
          set -euo pipefail
          version_name="${{ needs.verify.outputs.version }}"
          play_aab="build/app/outputs/bundle/playRelease/app-play-release.aab"
          research_apk="build/app/outputs/flutter-apk/app-research-release.apk"
          test -f "$play_aab"
          test -f "$research_apk"
          # The Play upload certificate is intentionally self-signed.  AAB
          # signature verification must therefore validate the signature
          # without treating the lack of a public CA chain as an error;
          # Google Play validates the upload key separately during upload.
          jarsigner -verify "$play_aab" > /dev/null
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?ANDROID_HOME or ANDROID_SDK_ROOT is required}}"
          build_tools_dir="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner_path="$build_tools_dir/apksigner"
          apkanalyzer_path="$(find "$sdk_root" -type f -name apkanalyzer -perm -u+x | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          test -x "$apkanalyzer_path"
          "$apksigner_path" verify --verbose --print-certs "$research_apk"
          test "$("$apkanalyzer_path" manifest debuggable "$research_apk")" = "false"
          "$apkanalyzer_path" manifest permissions "$research_apk" > android-research-permissions.txt
          cp "$play_aab" "gamblock-ai-play-${version_name}+${GITHUB_RUN_NUMBER}.aab"
          cp "$research_apk" "gamblock-ai-research-${version_name}+${GITHUB_RUN_NUMBER}.apk"
          sha256sum gamblock-ai-* android-research-permissions.txt > android-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            gamblock-ai-play-*.aab
            gamblock-ai-research-*.apk
            android-research-permissions.txt
            android-SHA256SUMS.txt
          retention-days: 30

  windows_pilot:
    needs: verify
    if: ${{ vars.ENABLE_WINDOWS_PILOT_RELEASE == 'true' }}
    runs-on: windows-latest
    environment: pilot-signing
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore and validate pilot certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_PILOT_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_PILOT_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { throw "WINDOWS_PILOT_SIGNING_PFX_BASE64 is required" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) { throw "WINDOWS_PILOT_SIGNING_PFX_PASSWORD is required" }
          $pfxPath = "$env:RUNNER_TEMP\gamblock-pilot-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          Get-PfxData -FilePath $pfxPath -Password $password | Out-Null
      - name: Create public production configuration
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) { throw "PROD_API_BASE_URL is required" }
          if ([string]::IsNullOrWhiteSpace($env:WEB_BASE_URL)) { throw "WEB_BASE_URL is required" }
          @"
          APP_ENV=production
          API_BASE_URL=$env:API_BASE_URL
          WEB_BASE_URL=$env:WEB_BASE_URL
          "@ | Set-Content -Encoding utf8NoBOM .env
      - name: Validate public grant trust store
        shell: pwsh
        env:
          TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TRUST_STORE_BASE64)) { throw "PROTECTION_GRANT_TRUST_STORE_BASE64 is required" }
          $json = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TRUST_STORE_BASE64))
          $trustStore = $json | ConvertFrom-Json
          if ($null -eq $trustStore -or @($trustStore.PSObject.Properties).Count -eq 0) {
            throw "PROTECTION_GRANT_TRUST_STORE_BASE64 must decode to a non-empty JSON object"
          }
      - run: flutter pub get
      - name: Build Windows pilot release bundle
        env:
          PROTECTION_GRANT_TRUST_STORE_BASE64: ${{ vars.PROTECTION_GRANT_TRUST_STORE_BASE64 }}
        run: flutter build windows --release
      - name: Sign binaries, build MSI, and verify signatures
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_PILOT_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $bundle = (Resolve-Path "build\windows\x64\runner\Release").Path
          $pfx = "$env:RUNNER_TEMP\gamblock-pilot-signing.pfx"

          function Sign-Artifact([string] $path) {
            $arguments = @("sign", "/fd", "SHA256", "/f", $pfx, "/p", $env:SIGNING_PFX_PASSWORD)
            if (-not [string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)) {
              $arguments += @("/td", "SHA256", "/tr", $env:TIMESTAMP_URL)
            }
            $arguments += $path
            & signtool @arguments
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $path" }
            & signtool verify /pa /all $path
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $path" }
          }

          Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') } |
            ForEach-Object { Sign-Artifact $_.FullName }

          dotnet build windows\installer\GamblockAI.wixproj `
            -c Release -p:Platform=x64 -p:BundlePath="$bundle" `
            -p:ProductVersion="$version"
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }

          $msi = "windows\installer\bin\x64\Release\GamblockAI-$version-x64.msi"
          if (-not (Test-Path $msi)) { throw "Expected MSI was not produced: $msi" }
          Sign-Artifact $msi
          Copy-Item $msi "GamblockAI-Pilot-$version-x64.msi"
          Get-FileHash "GamblockAI-Pilot-$version-x64.msi" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  GamblockAI-Pilot-$version-x64.msi" } |
            Set-Content -Encoding ascii windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-pilot-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            GamblockAI-Pilot-*.msi
            windows-SHA256SUMS.txt
          retention-days: 30
