name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Create CI-only public configuration
        run: |
          printf '%s\n' \
            'APP_ENV=ci' \
            'API_BASE_URL=http://127.0.0.1:8080' \
            'WEB_BASE_URL=http://127.0.0.1:3000' > .env
      - run: bash scripts/verify-ai-context.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
        if: ${{ vars.ENABLE_CI_TESTS == 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ vars.ENABLE_CI_TESTS == 'true' }}
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: coverage/lcov.info
          retention-days: 7

  diagnostic_android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Create CI-only public configuration
        run: |
          printf '%s\n' \
            'APP_ENV=ci' \
            'API_BASE_URL=http://127.0.0.1:8080' \
            'WEB_BASE_URL=http://127.0.0.1:3000' > .env
      - run: flutter pub get
      - name: Build Play diagnostic APK
        run: |
          flutter build apk --debug --flavor play \
            --build-name 0.0.0-ci --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p ci-artifacts/android
          cp build/app/outputs/flutter-apk/app-play-debug.apk \
            "ci-artifacts/android/gamblock-ai-play-debug-${GITHUB_SHA::7}.apk"
      - name: Build Research diagnostic APK
        run: |
          flutter build apk --debug --flavor research \
            --build-name 0.0.0-ci --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-research-debug.apk \
            "ci-artifacts/android/gamblock-ai-research-debug-${GITHUB_SHA::7}.apk"
      - name: Build Research staging APK
        if: vars.STAGING_API_BASE_URL != '' && vars.STAGING_WEB_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$WEB_BASE_URL"
          printf '%s\n' \
            'APP_ENV=staging' \
            "API_BASE_URL=$API_BASE_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" > .env
          flutter build apk --debug --flavor research \
            --build-name 0.0.0-staging --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-research-debug.apk \
            "ci-artifacts/android/gamblock-ai-research-staging-${GITHUB_SHA::7}.apk"
      - name: Record Android diagnostic metadata
        run: |
          sha256sum ci-artifacts/android/* > ci-artifacts/android/SHA256SUMS.txt
          cat > ci-artifacts/android/BUILD-METADATA.json <<EOF
          {
            "lane": "diagnostic",
            "signed": false,
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "flutter_version": "${FLUTTER_VERSION}",
            "variants": ["play-debug-ci", "research-debug-ci", "research-staging-ci"]
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostic-android-${{ github.run_id }}
          path: ci-artifacts/android
          retention-days: 7

  diagnostic_windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Create CI-only public configuration
        shell: pwsh
        run: |
          @"
          APP_ENV=ci
          API_BASE_URL=http://127.0.0.1:8080
          WEB_BASE_URL=http://127.0.0.1:3000
          "@ | Set-Content -Encoding utf8NoBOM .env
      - run: flutter pub get
      - name: Build Windows diagnostic bundle
        env:
          PROTECTION_GRANT_TRUST_STORE_BASE64: ''
        run: flutter build windows --debug --build-name 0.0.0 --build-number $env:GITHUB_RUN_NUMBER
      - name: Build diagnostic MSI
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build\windows\x64\runner\Debug").Path
          dotnet build windows\installer\GamblockAI.wixproj `
            -c Release -p:Platform=x64 -p:BundlePath="$bundle" -p:ProductVersion=0.0.1
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic MSI build failed" }
          $msi = "windows\installer\bin\x64\Release\GamblockAI-0.0.1-x64.msi"
          if (-not (Test-Path $msi)) { throw "Expected diagnostic MSI was not produced" }
          New-Item -ItemType Directory -Force -Path ci-artifacts\windows | Out-Null
          Copy-Item $msi "ci-artifacts\windows\GamblockAI-diagnostic-${env:GITHUB_SHA}.msi"
          Compress-Archive -Path "$bundle\*" `
            -DestinationPath "ci-artifacts\windows\gamblock-ai-windows-debug-${env:GITHUB_SHA}.zip"
      - name: Record Windows diagnostic metadata
        shell: pwsh
        run: |
          Get-FileHash ci-artifacts\windows\* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } |
            Set-Content -Encoding ascii ci-artifacts\windows\SHA256SUMS.txt
          @"
          {
            "lane": "diagnostic",
            "signed": false,
            "commit": "$env:GITHUB_SHA",
            "run_id": "$env:GITHUB_RUN_ID",
            "flutter_version": "$env:FLUTTER_VERSION",
            "variants": ["windows-debug-ci", "windows-msi-ci"]
          }
          "@ | Set-Content -Encoding utf8NoBOM ci-artifacts\windows\BUILD-METADATA.json
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostic-windows-${{ github.run_id }}
          path: ci-artifacts\windows
          retention-days: 7
