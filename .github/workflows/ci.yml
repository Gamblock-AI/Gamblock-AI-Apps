name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: cp .env.example .env
      - run: bash scripts/verify-ai-context.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
        if: ${{ vars.ENABLE_CI_TESTS == 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ vars.ENABLE_CI_TESTS == 'true' }}
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  development_android:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create public development configuration
        env:
          API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$WEB_BASE_URL"
          printf '%s\n' \
            'APP_ENV=development' \
            "API_BASE_URL=$API_BASE_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" > .env

      - run: flutter pub get
      - name: Build development Android APK
        run: flutter build apk --debug
      - name: Prepare fixed-name Android asset
        run: cp build/app/outputs/flutter-apk/app-debug.apk gamblock-ai-android-development.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-development
          path: gamblock-ai-android-development.apk

  development_windows:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create public development configuration
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) { throw "DEV_API_BASE_URL is required" }
          if ([string]::IsNullOrWhiteSpace($env:WEB_BASE_URL)) { throw "WEB_BASE_URL is required" }
          @"
          APP_ENV=development
          API_BASE_URL=$env:API_BASE_URL
          WEB_BASE_URL=$env:WEB_BASE_URL
          "@ | Set-Content -Encoding utf8NoBOM .env

      - run: flutter pub get
      - name: Build development Windows bundle
        run: flutter build windows --debug
      - name: Prepare fixed-name Windows asset
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Debug\*" -DestinationPath "gamblock-ai-windows-development.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-development
          path: gamblock-ai-windows-development.zip

  production_debug_android:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create public production configuration
        env:
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$WEB_BASE_URL"
          printf '%s\n' \
            'APP_ENV=production' \
            "API_BASE_URL=$API_BASE_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" > .env

      - run: flutter pub get
      - name: Build debug-signed Android APK with production configuration
        run: flutter build apk --debug
      - name: Prepare fixed-name production debug Android asset
        run: cp build/app/outputs/flutter-apk/app-debug.apk gamblock-ai-android-production-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-production-debug
          path: gamblock-ai-android-production-debug.apk

  production_debug_windows:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create public production configuration
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) { throw "PROD_API_BASE_URL is required" }
          if ([string]::IsNullOrWhiteSpace($env:WEB_BASE_URL)) { throw "WEB_BASE_URL is required" }
          @"
          APP_ENV=production
          API_BASE_URL=$env:API_BASE_URL
          WEB_BASE_URL=$env:WEB_BASE_URL
          "@ | Set-Content -Encoding utf8NoBOM .env

      - run: flutter pub get
      - name: Build unsigned Windows debug bundle with production configuration
        run: flutter build windows --debug
      - name: Prepare fixed-name production debug Windows asset
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Debug\*" -DestinationPath "gamblock-ai-windows-production-debug.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-production-debug
          path: gamblock-ai-windows-production-debug.zip

  signed_production_android:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create public production configuration
        env:
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$WEB_BASE_URL"
          printf '%s\n' \
            'APP_ENV=production' \
            "API_BASE_URL=$API_BASE_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" > .env

      - name: Validate and restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamblock-release.jks"

      - run: flutter pub get
      - name: Build signed production Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gamblock-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk gamblock-ai-android-production.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-production
          path: gamblock-ai-android-production.apk

  signed_production_windows:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_RELEASE == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Create public production configuration
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) { throw "PROD_API_BASE_URL is required" }
          if ([string]::IsNullOrWhiteSpace($env:WEB_BASE_URL)) { throw "WEB_BASE_URL is required" }
          @"
          APP_ENV=production
          API_BASE_URL=$env:API_BASE_URL
          WEB_BASE_URL=$env:WEB_BASE_URL
          "@ | Set-Content -Encoding utf8NoBOM .env

      - name: Restore Windows signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { throw "WINDOWS_SIGNING_PFX_BASE64 is required" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) { throw "WINDOWS_SIGNING_PFX_PASSWORD is required" }
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\gamblock-signing.pfx",
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          )

      - run: flutter pub get
      - name: Build production Windows bundle
        run: flutter build windows --release
      - name: Sign and package Windows executables
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $bundle = "build\windows\x64\runner\Release"
          Get-ChildItem $bundle -Filter *.exe | ForEach-Object {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f "$env:RUNNER_TEMP\gamblock-signing.pfx" `
              /p "$env:SIGNING_PFX_PASSWORD" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)" }
          }
          Compress-Archive -Path "$bundle\*" -DestinationPath "gamblock-ai-windows-production.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-production
          path: gamblock-ai-windows-production.zip

  release_latest:
    needs:
      - verify
      - development_android
      - development_windows
      - production_debug_android
      - production_debug_windows
      - signed_production_android
      - signed_production_windows
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      needs.development_android.result == 'success' &&
      needs.development_windows.result == 'success' &&
      needs.production_debug_android.result == 'success' &&
      needs.production_debug_windows.result == 'success' &&
      needs.signed_production_android.result == 'success' &&
      needs.signed_production_windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Force-update mutable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --target "$GITHUB_SHA" \
              --title "Gamblock-AI latest ($GITHUB_SHA)" \
              --notes "Automated snapshot for commit $GITHUB_SHA. Production-config debug assets are not store-signed releases; signed production assets appear only when signing jobs are enabled."
          else
            gh release create latest \
              --target "$GITHUB_SHA" \
              --title "Gamblock-AI latest ($GITHUB_SHA)" \
              --notes "Automated snapshot for commit $GITHUB_SHA. Production-config debug assets are not store-signed releases; signed production assets appear only when signing jobs are enabled." \
              --latest
          fi

          for asset in \
            gamblock-ai-android-development.apk \
            gamblock-ai-windows-development.zip \
            gamblock-ai-android-production-debug.apk \
            gamblock-ai-windows-production-debug.zip \
            gamblock-ai-android-production.apk \
            gamblock-ai-windows-production.zip; do
            gh release delete-asset latest "$asset" --yes >/dev/null 2>&1 || true
          done
          gh release upload latest release-assets/* --clobber
